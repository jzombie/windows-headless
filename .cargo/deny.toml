[licenses]
# Permissive + weak-copyleft-free set matching an MIT OR Apache-2.0 crate.
# Everything in the tree today is covered; a new license fails loudly here.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # CDLA-Permissive-2.0: Mozilla root-cert dataset in webpki-root-certs
    # (via rustls-platform-verifier). Data license, no code copyleft.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MPL-2.0: option-ext (via directories). File-level copyleft only,
    # no impact on this crate's MIT OR Apache-2.0 licensing.
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[advisories]
ignore = [
    # RUSTSEC-2023-0071: RSA Marvin timing side-channel in `rsa`
    # (transitive via russh). No safe upgrade exists — still affected are
    # rsa 0.9.10 and 0.10.0-rc.18 (checked 2026-09-12; tracking
    # RustCrypto/RSA#626). Our SSH use is loopback to our own guest with
    # blind host-key acceptance, so there is no remote timing oracle.
    { id = "RUSTSEC-2023-0071", reason = "no fixed upstream; loopback-only SSH, no remote timing oracle" },
]
