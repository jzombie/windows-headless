
[package]
name = "windows-headless"
authors = ["Jeremy Harris <jeremy.harris@zenosmosis.com>"]
version = "0.3.3-alpha"
edition = "2024"
description = "Microsoft ISO to SSH-ready Windows 11 VM in one command. Unattended install, portable QEMU, no Docker. Quick dev environments."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jzombie/windows-headless"
categories = ["virtualization", "command-line-utilities"]
keywords = ["windows", "qemu", "ssh", "unattended-installer", "provisioning"]
default-run = "windows-headless"
[workspace]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.104"
cache-manager = "0.6.0"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.4"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
flate2 = "1.1"
hadris-fat = "2.4"
hadris-udf = "2.4"
hex = "0.4"
interprocess = { version = "2.4.4", features = ["tokio"] }
isomage = "2.1"
liblzma = "0.4"
png = "0.18"
quick-xml = "0.42"
reqwest = { version = "0.13.5", features = ["rustls", "stream", "json"] }
russh = "0.65"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11" }
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.53", features = ["process", "net", "time", "macros", "rt-multi-thread", "io-util", "io-std", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[features]
default = ["downloader"]
downloader = [
    "reqwest",
    "cache-manager",
    "tar",
    "flate2",
    "liblzma",
    "cache-manager/os-cache-dir",
]

[dependencies]
anyhow.workspace = true
cache-manager = { workspace = true, optional = true }
clap.workspace = true
crc32fast.workspace = true
crossterm.workspace = true
flate2 = { workspace = true, optional = true }
hadris-fat.workspace = true
hadris-udf.workspace = true
hex = { workspace = true }
interprocess.workspace = true
isomage.workspace = true
liblzma = { workspace = true, optional = true }
png.workspace = true
quick-xml.workspace = true
reqwest = { workspace = true, optional = true }
russh.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
tar = { workspace = true, optional = true }
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta = "1.49.0"
