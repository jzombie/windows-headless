[workspace]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.53", features = ["process", "net", "time", "macros", "rt-multi-thread", "io-util", "io-std", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = "0.42"
anyhow = "1.0.104"
tempfile = "3.27"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.6", features = ["derive"] }
cache-manager = "0.6.0"
tar = "0.4"
flate2 = "1.1"
liblzma = "0.4"
reqwest = { version = "0.13.5", features = ["rustls", "stream", "json"] }
sha2 = { version = "0.11" }
hex = "0.4"
hadris-udf = "2.4"
hadris-fat = "2.4"
isomage = "2.1"
crc32fast = "1.4"
interprocess = { version = "2.4.4", features = ["tokio"] }
png = "0.17"
russh = "0.52"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }

[package]
name = "windows-headless"
version = "0.1.0-alpha"
edition = "2024"
description = "Minimal-dependency headless Windows 11 VM provisioning and automation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jzombie/windows-headless"
default-run = "windows-headless"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
anyhow.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
cache-manager = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
liblzma = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true }
hex = { workspace = true }
hadris-udf.workspace = true
hadris-fat.workspace = true
isomage.workspace = true
crc32fast.workspace = true
interprocess.workspace = true
png.workspace = true
russh.workspace = true
crossterm.workspace = true

[features]
default = ["downloader"]
downloader = ["reqwest", "cache-manager", "tar", "flate2", "liblzma", "cache-manager/os-cache-dir"]

[dev-dependencies]
insta = "1.49.0"
