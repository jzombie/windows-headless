name: Test Headless Windows Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ensure only one run per branch/PR at a time. If new commits are pushed,
# older jobs will be automatically canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No ISO in CI: retail media lives behind Microsoft's interactive
      # download form, so no job here boots a VM. The signal is unit
      # tests plus live pin verification (release metadata + hashes only).
      - name: Unit tests (no VM)
        run: cargo test --lib

      - name: Verify pinned artifacts (no VM, no archives)
        # Hash-only sources (SHA256SUMS.txt, virtio sidecar) plus two ~5 MB
        # OpenSSH zips. Catches rotated assets / stale pins without a full
        # install; runs on every push and PR.
        run: cargo run --bin windows-headless -- verify-pins
