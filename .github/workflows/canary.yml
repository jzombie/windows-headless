name: Weekly Windows Canary Test

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Free disk space (14GB runner limit)
        # A canary needs ~35 GB: 6+ GB ISO, 10 GB installer image, and a
        # disk that grows toward 20 GB during Setup. Stock runners ship
        # with ~14 GB free — without this the install dies on ENOSPC.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          df -h

      - name: Download latest Windows ISO (Fido)
        run: |
          # The one acquisition step that cannot go through the Rust
          # pipeline: EvalCenter links require the interactive form, so
          # Fido drives the real download API instead. Everything after
          # this (pinned QEMU/wimlib/virtio/OpenSSH, media build, install)
          # runs through `cargo` below — no manual downloads, no apt QEMU.
          wget -O /tmp/Fido.ps1 https://raw.githubusercontent.com/pbatard/Fido/master/Fido.ps1
          pwsh -NoProfile -File /tmp/Fido.ps1 -Win 11 -Edition Enterprise -Lang English -Arch x64 -Quiet -Dir /tmp
          mv /tmp/*Windows_11*.iso /tmp/win11-latest.iso
          test -f /tmp/win11-latest.iso

      - name: Run canary test
        env:
          LATEST_WIN11_ISO: /tmp/win11-latest.iso
        run: cargo test --test canary_test -- --ignored --nocapture

      - name: Upload time-lapse screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-screenshots
          path: .cache/vms/win11/screenshots
