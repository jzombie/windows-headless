name: Weekly Windows Canary Test

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  # Fido is Windows-only by design (it exits 403 on Linux/macOS), so the
  # ISO acquisition runs here and travels to the Linux job as an artifact.
  # This is the one step that cannot go through the Rust pipeline:
  # EvalCenter links require the interactive form, so Fido drives the
  # real download API instead.
  fetch-iso:
    runs-on: windows-latest
    steps:
      - name: Download latest Windows ISO (Fido)
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/pbatard/Fido/master/Fido.ps1 -OutFile $env:RUNNER_TEMP/Fido.ps1
          & $env:RUNNER_TEMP/Fido.ps1 -Win 11 -Edition Enterprise -Lang English -Arch x64 -Quiet -Dir $env:RUNNER_TEMP
          Move-Item $env:RUNNER_TEMP/*Windows_11*.iso $env:RUNNER_TEMP/win11-latest.iso
          if (!(Test-Path $env:RUNNER_TEMP/win11-latest.iso)) { exit 1 }

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: win11-latest-iso
          path: ${{ runner.temp }}/win11-latest.iso
          retention-days: 2

  canary:
    needs: fetch-iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - name: Free disk space (14GB runner limit)
        # A canary needs ~35 GB: 6+ GB ISO, 10 GB installer image, and a
        # disk that grows toward 20 GB during Setup. Stock runners ship
        # with ~14 GB free — without this the install dies on ENOSPC.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          df -h

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: win11-latest-iso
          path: /tmp/canary-iso

      # Everything from here runs through `cargo` — pinned QEMU/wimlib/
      # virtio/OpenSSH via the fetch chain, media build, then install.
      # No manual downloads, no apt QEMU.
      - name: Run canary test
        env:
          LATEST_WIN11_ISO: /tmp/canary-iso/win11-latest.iso
        run: cargo test --test canary_test -- --ignored --nocapture

      - name: Upload time-lapse screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-screenshots
          path: .cache/vms/win11/screenshots
